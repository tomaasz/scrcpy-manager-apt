name: Publish signed APT
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apt-pages
  cancel-in-progress: false
jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Keep public repository schedule active once a month
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$(date -u +%d)" = 01 ] || exit 0
          endpoint="repos/$GITHUB_REPOSITORY/contents/schedule-keepalive.txt"
          previous=$(gh api "$endpoint" --jq .sha 2>/dev/null || true)
          content=$(date -u +%Y-%m | base64 -w0)
          args=(-f "message=chore: keep APT renewal schedule active" -f "content=$content")
          if [ -n "$previous" ]; then args+=(-f "sha=$previous"); fi
          gh api --method PUT "$endpoint" "${args[@]}" --silent
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Prepare public files and renew signatures
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          export GNUPGHOME="$RUNNER_TEMP/apt-signing"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          unset APT_SIGNING_KEY
          mkdir _site
          cp -a pool sources admin README.md LICENSE install.sh SHA256SUMS .nojekyll _site/
          python3 admin/build-apt.py --root _site --gpg-home "$GNUPGHOME" --key CFF184718B470F389319AABF6B5DD55898A9A341
          gpgv --keyring "$PWD/_site/archive-key.gpg" _site/dists/noble/InRelease
          gpgv --keyring "$PWD/_site/archive-key.gpg" _site/dists/trixie/InRelease
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
